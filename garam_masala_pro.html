<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>গরম মসলা ক্যালকুলেটর</title>

  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #333;
    }

    .container {
      max-width: 400px;
      margin: 40px auto;
      background: #fff;
      padding: 20px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #ccc;
      margin-bottom: 15px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #667eea;
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #5a67d8;
    }

    .toggle {
      display: flex;
      align-items: center;
      margin-top: 10px;
      font-size: 14px;
    }

    .result {
      margin-top: 20px;
    }

    .card {
      background: #f9f9f9;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      font-weight: 500;
    }

    .footer {
      text-align: center;
      font-size: 12px;
      margin-top: 15px;
      color: #888;
    }
  </style>
</head>

<body>

<div class="container">
  <h2>🌿 গরম মসলা</h2>

  <input type="number" id="total" placeholder="মোট পরিমাণ (গ্রাম)">

  <button onclick="calculate()">হিসাব করুন</button>

  <div class="toggle">
    <input type="checkbox" id="round"> &nbsp; Round Number
  </div>

  <div class="result" id="result"></div>

  <div class="footer">Made with ❤️</div>
</div>

<script>
function calculate() {
  let total = parseFloat(document.getElementById("total").value);
  let round = document.getElementById("round").checked;

  if (!total || total <= 0) {
    alert("সঠিক পরিমাণ দিন!");
    return;
  }

  const ingredients = [
    { name: "জিরা", ratio: 0.40 },
    { name: "ধনিয়া", ratio: 0.20 },
    { name: "এলাচ", ratio: 0.10 },
    { name: "দারুচিনি", ratio: 0.10 },
    { name: "লবঙ্গ", ratio: 0.05 },
    { name: "গোলমরিচ", ratio: 0.05 },
    { name: "তেজপাতা", ratio: 0.04 },
    { name: "শাহী জিরা", ratio: 0.024 },
    { name: "জয়ফল", ratio: 0.02 },
    { name: "জয়ত্রী", ratio: 0.016 }
  ];

  let resultDiv = document.getElementById("result");
  resultDiv.innerHTML = "";

  ingredients.forEach(item => {
    let amount = total * item.ratio;
    amount = round ? Math.round(amount) : amount.toFixed(2);

    resultDiv.innerHTML += `
      <div class="card">
        <span>${item.name}</span>
        <span>${amount} g</span>
      </div>
    `;
  });
}
</script>

</body>
</html>
